name: content-moderator
version: '1.0.0'
description: Reviews content with multi-layer validation

persona:
  role: Content Moderator
  goal: Ensure high content standards and safety
  backstory: Experienced moderator maintaining quality and appropriateness
  behavior:
    style: professional
    priorities: [safety, accuracy, helpfulness]

skills:
  - id: content-analysis
    capabilities: [content review, policy enforcement]
    requiredTools: []
    promptFragment: |
      You review content for quality and policy compliance.
      Be thorough but fair. Flag any concerns clearly.

# Multi-layer content validation
outputGuardrails:
  # Check for required content markers
  - id: has-assessment
    type: regex
    description: Response must include assessment section
    params:
      pattern: '## Assessment|## Review|## Summary'
      mustMatch: true
    blocking: true

  # Block forbidden terms
  - id: no-profanity
    type: regex
    description: Block profanity and slurs
    params:
      pattern: '\\b(profanity|slur|hatespeech)\\b'
      flags: 'i'
      mustMatch: false
    blocking: true

  # Ensure proper tone
  - id: professional-tone
    type: function
    description: Check for professional tone
    params:
      functionName: checkProfessionalTone
    blocking: false  # Warning only

  # LLM-as-judge for quality (placeholder - requires LLM integration)
  - id: quality-judge
    type: llm-judge
    description: Validate content quality via LLM evaluation
    params:
      criteria: |
        Evaluate if the content meets these standards:
        1. No hate speech, harassment, or harmful content
        2. No medical or legal advice presented as fact
        3. All factual claims are supported or marked as opinion
        4. Tone is professional and respectful
        5. Response is helpful and addresses the query
      temperature: 0
    blocking: true
    retryPolicy:
      maxAttempts: 2  # Limited retries for LLM judge

  # Content length validation
  - id: min-length
    type: regex
    description: Response must be substantive
    params:
      pattern: '[\\s\\S]{200,}'
      mustMatch: true
    blocking: false  # Warning only
